<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Audit log | Hive Mind</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body
    class="dashboard-page admin-page"
    data-role="ORGANIZATION"
    data-admin-page="audit"
  >
    <main class="admin-shell">
      <aside class="admin-sidebar">
        <a class="brand" href="admin-dashboard.html">Hive <span>Mind</span><b>.</b></a>
        <p class="sidebar-label">Organization</p>
        <nav class="admin-nav" aria-label="Organization navigation">
          <a href="admin-dashboard.html" data-page="overview">Overview</a
          ><a href="admin-users.html" data-page="users">People</a
          ><a href="admin-courses.html" data-page="courses">Course approvals</a
          ><a href="admin-categories.html" data-page="categories">Categories</a
          ><a href="admin-audit.html" data-page="audit">Audit log</a
          ><a href="admin-reports.html" data-page="reports"
            >Reports &amp; analytics</a
          >
        </nav>
        <button id="logout" class="logout sidebar-logout" type="button">
          Logout
        </button>
      </aside>
      <section class="admin-content">
        <header class="admin-topbar">
          <div>
            <p class="panel-label">Organization audit</p>
            <h1>Full activity history</h1>
          </div>
          <span class="role-badge" id="user-name">Organization</span>
        </header>
        <p id="admin-message" class="message" aria-live="polite"></p>
        <section class="management-panel" data-reveal>
          <div class="management-heading">
            <div>
              <h2>Audit log</h2>
              <p>
                Every registration, approval, submission and grade across your
                organization, newest first.
              </p>
            </div>
            <div class="filter-group">
              <label class="filter-label" for="audit-action"
                >Action<select id="audit-action">
                  <option value="">All actions</option>
                </select></label
              >
            </div>
          </div>
          <div class="user-table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Action</th>
                  <th>Actor</th>
                  <th>What</th>
                  <th>When</th>
                </tr>
              </thead>
              <tbody id="audit-table"></tbody>
            </table>
          </div>
        </section>
      </section>
    </main>
    <script src="dash-nav.js"></script>
    <script src="animations.js"></script>
    <script src="activity-feed.js"></script>
    <script src="admin-nav.js"></script>
    <script src="admin.js"></script>
  </body>
</html>
