spring.application.name=backend

# Create the database once in MySQL: CREATE DATABASE lms_db;
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/lms_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:RandomBullshitGo}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# Use secure cookies when deploying behind HTTPS.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Optional local-development administrator. Institution registration is enabled in the
# application, so bootstrap is disabled by default and must be explicitly enabled.
app.admin.email=${APP_ADMIN_EMAIL:admin@adaptivelearning.local}
app.admin.password=${APP_ADMIN_PASSWORD:}
app.admin.full-name=${APP_ADMIN_FULL_NAME:Platform Administrator}
app.admin.bootstrap-enabled=${APP_ADMIN_BOOTSTRAP_ENABLED:false}
server.port=8080
