<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Course Approvals | Hive Mind</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body
    class="dashboard-page admin-page"
    data-role="ADMIN"
    data-admin-page="courses"
  >
    <main class="admin-shell">
      <aside class="admin-sidebar">
        <a class="brand" href="admin-dashboard.html"
          >Hive <span>Mind</span><b>.</b></a
        >
        <p class="sidebar-label">Administration</p>
        <nav class="admin-nav" aria-label="Admin navigation">
          <a href="admin-dashboard.html" data-page="overview">Overview</a
          ><a href="admin-users.html" data-page="users">Users</a
          ><a href="admin-courses.html" data-page="courses">Course approvals</a
          ><a href="admin-categories.html" data-page="categories">Categories</a
          ><a href="admin-reports.html" data-page="reports"
            >Reports &amp; analytics</a
          >
        </nav>
        <button id="logout" class="logout sidebar-logout" type="button">
          Logout
        </button>
      </aside>
      <section class="admin-content">
        <header class="admin-topbar">
          <div>
            <p class="panel-label">Course governance</p>
            <h1>Course approvals</h1>
          </div>
          <span class="role-badge" id="user-name">Administrator</span>
        </header>
        <p id="admin-message" class="message" aria-live="polite"></p>
        <section class="management-panel">
          <div class="management-heading">
            <div>
              <h2>Submitted courses</h2>
              <p>Review course submissions before students can enroll.</p>
            </div>
            <label class="filter-label" for="course-status-filter"
              >Course status<select id="course-status-filter">
                <option value="">All courses</option>
                <option value="PENDING">Pending review</option>
                <option value="APPROVED">Approved</option>
                <option value="SUSPENDED">Suspended</option>
                <option value="REJECTED">Rejected</option>
              </select></label
            >
          </div>
          <div class="user-table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Course</th>
                  <th>Description</th>
                  <th>Teacher</th>
                  <th>Category</th>
                  <th>Status</th>
                  <th>Management</th>
                </tr>
              </thead>
              <tbody id="courses-table"></tbody>
            </table>
          </div>
        </section>
      </section>
    </main>
    <script src="admin-nav.js"></script>
    <script src="admin.js"></script>
  </body>
</html>
